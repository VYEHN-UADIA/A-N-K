# À placer dans les directives Nginx additionnelles du vhost Cercle.
client_max_body_size 52m;

# Le noyau, l'état et les corpus ne sont jamais servis directement.
location ^~ /main/src/html/AnankeAI/ananke_core/ { deny all; }
location ^~ /main/src/html/AnankeAI/state/ { deny all; }
location ^~ /main/src/html/AnankeAI/corpus/ { deny all; }
location ^~ /main/src/html/AnankeAI/private/ { deny all; }
location ^~ /main/src/html/AnankeAI/tests/ { deny all; }

# Seuls le PHP et les assets nécessaires au client restent accessibles.
